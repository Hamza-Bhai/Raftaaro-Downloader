name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the postinstall step, which downloads Electron,
      # yt-dlp and FFmpeg. The checks below do not need them.
      - run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
