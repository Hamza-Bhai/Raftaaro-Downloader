<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Raftaaro</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <aside class="sidebar">
      <div class="brand">⚡ Raftaaro</div>
      <nav>
        <button class="nav active" data-view="all">⬇ Downloads</button>
        <button class="nav" data-view="videos">🎬 Videos</button>
        <button class="nav" data-view="audio">🎵 Audio</button>
        <button class="nav" data-view="done">✅ Done</button>
        <button class="nav" data-view="settings">⚙ Settings</button>
      </nav>
    </aside>

    <main>
      <form class="addbar" id="addForm">
        <input id="urlInput" type="text" placeholder="Paste a link…" autocomplete="off" spellcheck="false" />
        <button type="submit" class="primary">Download</button>
      </form>
      <div id="banner" class="banner" hidden></div>
      <section id="list" class="list"></section>
      <p id="empty" class="empty">No downloads yet. Paste a link above to start.</p>
      <section id="settings" class="settings" hidden></section>
    </main>

    <div id="dialogRoot"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
